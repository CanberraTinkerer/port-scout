name: "Port Scout"
slug: "port_scout"
description: "Network port scanner and collision-free port allocator for homelabs"
version: "1.0.0"
startup: services
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
host_network: true
docker_api: true
ingress: true
ingress_port: 5055
panel_icon: "mdi:radar"
panel_title: "Port Scout"
image: "ghcr.io/canberratinkerer/port-scout-{arch}"
options:
  port: 5055
  min_port: 8000
  max_port: 9999
schema:
  port: port
  min_port: int
  max_port: int
